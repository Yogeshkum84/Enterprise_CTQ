name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit flake8

      - name: Run pip-audit (SCA)
        run: |
          pip-audit -r requirements.txt -f json -o pip_audit_report.json

      - name: Run Bandit (static security analysis)
        run: |
          bandit -r . -lll || true

      - name: Run flake8 (lint)
        run: |
          flake8 || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip_audit_report.json

      - name: Run pytest
        run: |
          pip install pytest
          pytest -q

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (scan repository for secrets)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
